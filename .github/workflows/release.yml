name: Release

# Run from the Actions tab ("Run workflow") or by pushing a tag like v1.0.0.
# The tag is taken from versionName in app/build.gradle.kts.
#
# Signing: add these repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64  base64 of the release keystore (.jks / .p12)
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias
#   SIGNING_KEY_PASSWORD     key password
# Without them the workflow stops, unless "temporary_key" is ticked: the APK is then signed with
# a throwaway key, and later versions signed with a different key cannot update it in place.

on:
  workflow_dispatch:
    inputs:
      temporary_key:
        description: "Sign with a throwaway key if no signing secrets are set"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ -z "$name" ]; then echo "::error::versionName not found"; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name"
            exit 1
          fi
          if [ ! -f "docs/release-notes/v$name.md" ]; then
            echo "::error::Missing docs/release-notes/v$name.md"
            exit 1
          fi

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TEMPORARY_KEY: ${{ inputs.temporary_key }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          elif [ "$TEMPORARY_KEY" = "true" ]; then
            echo "::warning::Signing with a throwaway key. Later versions signed with another key cannot update this one in place."
            STORE_PASSWORD=$(openssl rand -hex 24)
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS=openup
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=OpenUp" >/dev/null
          else
            echo "::error::No signing key. Add the SIGNING_* repository secrets, or run the workflow with temporary_key."
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Verify signature and prepare files
        id: files
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then echo "::error::Signed release APK not found"; ls -R app/build/outputs/apk; exit 1; fi
          bt=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$bt/apksigner" verify --verbose --print-certs "$apk"
          out="OpenUp-${{ steps.version.outputs.tag }}.apk"
          cp "$apk" "$out"
          sha256sum "$out" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" "OpenUp-$TAG.apk" SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "OpenUp $NAME" \
            --notes-file "docs/release-notes/$TAG.md"

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
